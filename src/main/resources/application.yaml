spring:
  application:
    name: chat-app

  datasource:
    url: jdbc:postgresql://localhost:5432/chat_db
    username: ${DB_USERNAME:we}
    password: ${DB_PASSWORD:we}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:long-256-bit-secret-key}
  expiration: 86400000

server:
  port: 8080

managements:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized